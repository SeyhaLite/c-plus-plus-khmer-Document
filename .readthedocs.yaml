# Read the Docs build configuration (version 2 schema).
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Fail the build if the Khmer content, glossary or code examples are broken.
    pre_build:
      - python scripts/pipeline.py validate --strict
      - python scripts/check_examples.py --strict

sphinx:
  configuration: docs/conf.py
  # The build is verified locally with -W (warnings as errors). On Read the
  # Docs we keep building even if a future contributor introduces a warning,
  # because a rendered site is more useful than a failed deployment.
  fail_on_warning: false

python:
  install:
    - requirements: requirements.txt
