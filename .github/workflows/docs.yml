name: Documentation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and run every C++ example
        run: python scripts/check_examples.py --strict

      - name: Validate Khmer content, links and terminology
        run: python scripts/pipeline.py validate --strict

      - name: Build documentation (warnings are errors)
        run: python -m sphinx -b html -W docs docs/_build/html

      - name: Show live translation statistics
        run: python scripts/pipeline.py status

      - uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html
